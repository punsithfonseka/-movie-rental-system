<!DOCTYPE html>
<html>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<script>
  // ✅ Admin only access
  if (localStorage.getItem("role") !== "ADMIN") {
      console.log("ROLE:", localStorage.getItem("role"));
      alert("Admins only!");
      window.location.href = "login.html";
  }
</script>

<div class="container">

  <h1>Contributor Profiles</h1>

  <!-- ✅ BACK BUTTON ONLY -->
  <div class="nav-buttons">
    <button onclick="goBack()">Back</button>
  </div>

  <!-- ✅ LOAD BUTTON -->
  <button onclick="loadContributors()">Load Contributors</button>

  <ul id="list"></ul>

</div>

<script>

  // ✅ BACK NAVIGATION
  function goBack() {
      window.location.href = "add-movie.html";
  }


  // ✅ LOAD CONTRIBUTORS
  function loadContributors() {

      fetch("/contributors/all")
          .then(res => res.json())
          .then(data => {

              const list = document.getElementById("list");
              list.innerHTML = "";

              data.forEach(c => {

                  const li = document.createElement("li");

                  li.innerHTML = `
                      <b>${c.name}</b><br>
                      Role: ${c.role}<br>
                      Age: ${c.age}<br>
                      Country: ${c.country}<br>

                      <button onclick="goEdit('${c.id}')">Edit</button>
                      <button onclick="del('${c.id}')">Delete</button>
                      <hr>
                  `;

                  list.appendChild(li);
              });
          });
  }


  // ✅ DELETE
  function del(id) {

      fetch(`/contributors/delete/${id}`, {
          method: "DELETE"
      })
      .then(res => res.text())
      .then(msg => {
          alert(msg);
          loadContributors();
      });
  }


  // ✅ GO TO EDIT
  function goEdit(id) {
      window.location.href = `add-contributor.html?id=${id}`;
  }

</script>

</body>
</html>
