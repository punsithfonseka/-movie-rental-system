<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Movies</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            font-family: "Poppins", Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(0,0,0,0.75),
                    rgba(0,0,0,0.92)
                ),
                url("/images/bg.jpg");

            background-size: cover;
            background-position: center;

            color: white;
        }

        .container {
            width: 100%;
            max-width: 1200px;

            margin: 30px auto;
            padding: 30px;

            background: rgba(20,20,20,0.92);

            border-radius: 24px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.7);
        }

        h1 {
            text-align: center;
            color: #f5c518;
            font-size: 42px;
            margin-bottom: 25px;
        }

        .top-bar {

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .search-box input {
            width: 300px;
            padding: 12px 15px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 15px;
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 0 12px rgba(245,197,24,0.5);
        }

        .nav-btns {
            display: flex;
            gap: 10px;
        }

        /* 🔼 UPDATED: Bigger Back/Next buttons */
        .nav-btns button {
            padding: 14px 20px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            background: rgba(255,255,255,0.08);
            color: white;
            transition: 0.3s;
            font-size: 15px;
            font-weight: 600;
        }

        .nav-btns button:hover {
            background: rgba(255,255,255,0.15);
        }

        /* 🔴 UPDATED: Stronger red logout button */
        .logout-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            background: #e60000;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            font-size: 15px;
        }

        .logout-btn:hover {
            transform: scale(1.05);
            background: #ff1a1a;
        }

        .list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,0.08);
        }

        .banner {
            width: 100%;
            height: 380px;
            object-fit: cover;
        }

        .card-content {
            padding: 18px;
        }

        .btns {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .edit {
            background: linear-gradient(135deg,#f5c518,#ffd84d);
            color: black;
        }

        .delete {
            background: crimson;
            color: white;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🎬 Edit Movies</h1>

    <div class="top-bar">

        <div class="nav-btns">

            <button onclick="goBack()">⬅ Back</button>
            <button onclick="goNext()">Next ➡</button>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

        <div class="search-box">

            <input type="text"
                   id="search"
                   placeholder="Search movie..."
                   onkeyup="filterMovies()">

        </div>

    </div>

    <div class="list" id="movieList"></div>

</div>

<script>

    let moviesData = [];

    document.addEventListener("DOMContentLoaded", loadMovies);

    async function loadMovies() {

        try {
            const res = await fetch("/movies/all");
            moviesData = await res.json();
            renderMovies(moviesData);
        } catch (error) {
            console.error(error);
            alert("Failed to load movies.");
        }
    }

    function renderMovies(data) {

        const list = document.getElementById("movieList");
        list.innerHTML = "";

        if (data.length === 0) {
            list.innerHTML = `<p style="text-align:center;color:#bbb;font-size:18px;">No movies found</p>`;
            return;
        }

        data.forEach(movie => {

            list.innerHTML += `
                <div class="card">

                    <img class="banner"
                         src="${movie.banner || '/images/default-banner.jpg'}"
                         alt="Movie Banner">

                    <div class="card-content">

                        <h3>${movie.title}</h3>
                        <small>${movie.year || 'N/A'}</small>

                        <div class="btns">

                            <button class="edit"
                                onclick="editMovie('${movie.movieId}')">
                                Edit
                            </button>

                            <button class="delete"
                                onclick="deleteMovie('${movie.movieId}')">
                                Delete
                            </button>

                        </div>

                    </div>

                </div>
            `;
        });
    }

    function filterMovies() {

        const value = document.getElementById("search").value.toLowerCase();

        const filtered = moviesData.filter(movie =>
            movie.title.toLowerCase().includes(value)
        );

        renderMovies(filtered);
    }

    function editMovie(id) {
        window.location.href = "edit-movie-form.html?id=" + id;
    }

    async function deleteMovie(id) {

        const confirmDelete = confirm("Are you sure you want to delete this movie?");
        if (!confirmDelete) return;

        try {
            await fetch("/movies/delete/" + id, { method: "DELETE" });
            loadMovies();
        } catch (error) {
            console.error(error);
            alert("Failed to delete movie.");
        }
    }

    function goBack() {
        window.location.href = "add-movie.html";
    }

    function goNext() {
        window.location.href = "contributors.html";
    }

    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

</script>

</body>
</html>
