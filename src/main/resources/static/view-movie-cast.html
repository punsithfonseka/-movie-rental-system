<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IMDb Style Movie Cast Viewer</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>

        body {

            font-family: Arial, sans-serif;

            background:
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
                url("/images/bg.jpg");

            background-size: cover;
            background-position: center;

            color: white;

            margin: 0;
            padding: 0;

            min-height: 100vh;
        }

        .container {

            width: 90%;
            max-width: 1200px;

            margin: auto;
            padding: 30px;
        }

        h1 {

            text-align: center;

            color: #f5c518;

            font-size: 52px;

            margin-bottom: 30px;
        }

        /* SEARCH */

        #searchBox {

            position: relative;

            margin-bottom: 30px;
        }

        #search {

            width: 100%;

            padding: 18px;

            border-radius: 40px;

            border: none;

            background: rgba(0,0,0,0.85);

            color: white;

            font-size: 17px;

            box-sizing: border-box;
        }

        #search:focus {

            outline: none;

            box-shadow:
                0 0 15px rgba(245,197,24,0.8);
        }

        /* BUTTONS */

        .button-group {

            display: flex;

            gap: 15px;

            margin-top: 18px;
        }

        .search-btn,
        .logout-btn {

            flex: 1;

            padding: 15px;

            border: none;

            border-radius: 30px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .search-btn {

            background:
                linear-gradient(135deg,#f5c518,#ffd700);

            color: black;
        }

        .logout-btn {

            background: crimson;

            color: white;
        }

        .search-btn:hover,
        .logout-btn:hover {

            transform: scale(1.02);
        }

        /* SUGGESTIONS */

        #suggestions {

            position: absolute;

            top: 68px;

            width: 100%;

            background: rgba(0,0,0,0.96);

            border-radius: 15px;

            overflow: hidden;

            display: none;

            z-index: 1000;
        }

        .suggestion-item {

            padding: 14px;

            cursor: pointer;

            transition: 0.3s;
        }

        .suggestion-item:hover {

            background: #f5c518;

            color: black;
        }

        /* MOVIE SECTION */

        .movie-section {

            margin-top: 40px;
        }

        .section-title {

            color: #f5c518;

            font-size: 30px;

            margin-bottom: 20px;
        }

        /* MOVIE GRID */

        .movie-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 25px;
        }

        .movie-card {

            background: rgba(255,255,255,0.08);

            border-radius: 20px;

            overflow: hidden;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.5);
        }

        .movie-card:hover {

            transform: translateY(-6px);

            background: rgba(255,255,255,0.12);
        }

        .movie-banner {

            width: 100%;
            height: 320px;

            object-fit: cover;
        }

        .movie-info {

            padding: 18px;
        }

        .movie-title {

            font-size: 22px;

            color: #f5c518;

            margin-bottom: 8px;
        }

        .movie-year {

            color: #ccc;
        }

        /* RESULT */

        #result {

            margin-top: 40px;
            margin-bottom: 25px;
        }

        #result h2 {

            color: #f5c518;

            font-size: 36px;
        }

        /* CAST LIST */

        #actorList {

            list-style: none;

            padding: 0;
        }

        .profile-btn {

            display: flex;

            align-items: center;

            gap: 15px;

            padding: 18px;

            margin-bottom: 15px;

            background: rgba(255,255,255,0.08);

            border-radius: 18px;

            cursor: pointer;

            transition: 0.3s;
        }

        .profile-btn:hover {

            background: rgba(255,255,255,0.13);

            transform: translateY(-3px);
        }

        .avatar {

            width: 70px;
            height: 70px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #f5c518;
        }

        .name {

            font-size: 20px;

            font-weight: bold;
        }

        .role {

            color: #ccc;

            margin-top: 4px;
        }

        /* PROFILE CARD */

        .profile-card {

            margin-top: 35px;

            background: rgba(255,255,255,0.08);

            padding: 35px;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.5);
        }

        .profile-img {

            width: 150px;
            height: 150px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #f5c518;

            margin-bottom: 20px;
        }

        .profile-card h2 {

            color: #f5c518;

            margin-bottom: 20px;
        }

        .profile-card p {

            line-height: 1.8;

            color: #ddd;
        }

        @media (max-width: 768px) {

            h1 {
                font-size: 38px;
            }

            .movie-banner {
                height: 260px;
            }

            .button-group {
                flex-direction: column;
            }
        }

    </style>

</head>

<body>

<script>

    if (!localStorage.getItem("role")) {

        alert("Please login first");

        window.location.href = "login.html";
    }

</script>

<div class="container">

    <h1>🎬 Movie Cast Viewer</h1>

    <!-- SEARCH -->

    <div id="searchBox">

        <input type="text"
               id="search"
               placeholder="Search movie..."
               onkeyup="showSuggestions()">

        <div id="suggestions"></div>

        <div class="button-group">

            <button class="search-btn"
                    onclick="searchMovie()">

                Search

            </button>

            <button class="logout-btn"
                    onclick="logout()">

                Logout

            </button>

        </div>

    </div>

    <!-- SUGGESTED MOVIES -->

    <div class="movie-section">

        <h2 class="section-title">
            Suggested Movies
        </h2>

        <div class="movie-grid"
             id="movieGrid">

        </div>

    </div>

    <!-- RESULT -->

    <div id="result"></div>

    <!-- CAST -->

    <ul id="actorList"></ul>

    <!-- PROFILE -->

    <div id="profile"></div>

</div>

<script>

    let allMovies = [];

    document.addEventListener(
        "DOMContentLoaded",
        loadMovies
    );

    async function loadMovies() {

        try {

            const res =
                await fetch("/movies/all");

            allMovies =
                await res.json();

            renderSuggestedMovies();

        } catch(error) {

            console.error(error);

            alert("Failed to load movies");
        }
    }

    /* LOGOUT */

    function logout() {

        localStorage.removeItem("role");

        alert("Logged out successfully");

        window.location.href = "login.html";
    }

    /* RENDER MOVIES */

    function renderSuggestedMovies() {

        const grid =
            document.getElementById("movieGrid");

        grid.innerHTML = "";

        allMovies.forEach(movie => {

            grid.innerHTML += `

                <div class="movie-card"
                     onclick="showMovieById('${movie.movieId}')">

                    <img
                        class="movie-banner"

                        src="${
                            movie.banner ||
                            '/images/default-banner.jpg'
                        }"

                        onerror="
                            this.src='/images/default-banner.jpg'
                        "

                        alt="Movie Banner">

                    <div class="movie-info">

                        <div class="movie-title">
                            ${movie.title}
                        </div>

                        <div class="movie-year">
                            ${movie.year || 'N/A'}
                        </div>

                    </div>

                </div>

            `;
        });
    }

    /* SEARCH SUGGESTIONS */

    function showSuggestions() {

        const keyword =
            document.getElementById("search")
            .value
            .toLowerCase();

        const box =
            document.getElementById("suggestions");

        box.innerHTML = "";

        if (!keyword) {

            box.style.display = "none";

            return;
        }

        const filtered =
            allMovies.filter(movie =>

                movie.title
                    .toLowerCase()
                    .includes(keyword)
            );

        filtered.forEach(movie => {

            const div =
                document.createElement("div");

            div.className =
                "suggestion-item";

            div.innerText =
                movie.title;

            div.onclick = () => {

                document
                .getElementById("search")
                .value = movie.title;

                box.style.display = "none";

                showMovie(movie);
            };

            box.appendChild(div);
        });

        box.style.display =
            filtered.length ? "block" : "none";
    }

    /* SEARCH */

    function searchMovie() {

        const keyword =
            document.getElementById("search")
            .value
            .toLowerCase();

        const movie =
            allMovies.find(m =>

                m.title.toLowerCase() === keyword
            );

        if (!movie) {

            alert("Movie not found");

            return;
        }

        showMovie(movie);
    }

    /* SHOW MOVIE FROM BANNER CLICK */

    function showMovieById(id) {

        const movie =
            allMovies.find(m => m.movieId == id);

        if (!movie) {

            alert("Movie not found");

            return;
        }

        showMovie(movie);
    }

    /* SHOW MOVIE CAST */

    function showMovie(movie) {

        console.log(movie);

        const resultDiv =
            document.getElementById("result");

        const actorList =
            document.getElementById("actorList");

        resultDiv.innerHTML = `

            <h2>${movie.title}</h2>

            <p>
                <b>
                    Cast Members:
                    ${movie.contributors ? movie.contributors.length : 0}
                </b>
            </p>

        `;

        actorList.innerHTML = "";

        document.getElementById("profile").innerHTML = "";

        if (
            !movie.contributors ||
            movie.contributors.length === 0
        ) {

            actorList.innerHTML = `

                <p style="
                    color:#ccc;
                    margin-top:15px;
                ">
                    No contributors found for this movie.
                </p>

            `;

            return;
        }

        movie.contributors.forEach(c => {

            const li =
                document.createElement("li");

            li.className =
                "profile-btn";

            li.innerHTML = `

                <img
                    src="${
                        c.photo ||
                        'https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png'
                    }"

                    class="avatar"

                    onerror="
                        this.src='https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png'
                    ">

                <div>

                    <div class="name">
                        ${c.name || 'Unknown'}
                    </div>

                    <div class="role">
                        ${c.role || 'Contributor'}
                    </div>

                </div>

            `;

            li.onclick = () =>
                showProfile(c);

            actorList.appendChild(li);
        });

        window.scrollTo({

            top:
                resultDiv.offsetTop - 30,

            behavior: "smooth"
        });
    }

    /* SHOW PROFILE */

    function showProfile(c) {

        document.getElementById("profile").innerHTML = `

            <div class="profile-card">

                <img
                    src="${
                        c.photo ||
                        'https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png'
                    }"

                    class="profile-img"

                    onerror="
                        this.src='https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png'
                    ">

                <h2>${c.name || 'Unknown'}</h2>

                <p>
                    <b>Role:</b>
                    ${c.role || 'N/A'}
                </p>

                <p>
                    <b>Country:</b>
                    ${c.country || 'N/A'}
                </p>

                <p>
                    <b>Date Of Birth:</b>
                    ${c.dateOfBirth || 'Not provided'}
                </p>

                <p>
                    <b>Age:</b>

                    ${
                        c.dateOfBirth
                        ? calculateAge(c.dateOfBirth)
                        : 'N/A'
                    }
                </p>

                <p>
                    <b>Description:</b>

                    ${
                        c.description ||
                        'No description available'
                    }
                </p>

                <p>
                    <b>Awards:</b>

                    ${
                        c.awards ||
                        'No awards listed'
                    }
                </p>

                <p>
                    <b>Notable Works:</b>

                    ${
                        c.notableWorks ||
                        'No works listed'
                    }
                </p>

            </div>

        `;
    }

    /* AGE */

    function calculateAge(dob) {

        if (!dob) return "";

        const birthDate =
            new Date(dob);

        const today =
            new Date();

        let age =
            today.getFullYear() -
            birthDate.getFullYear();

        const monthDiff =
            today.getMonth() -
            birthDate.getMonth();

        if (

            monthDiff < 0 ||

            (
                monthDiff === 0 &&
                today.getDate() <
                birthDate.getDate()
            )
        ) {

            age--;
        }

        return age;
    }

</script>

</body>
</html>
