<!DOCTYPE html>
<html>
<head>
    <title>Movie Cast Viewer</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>

        /* ✅ SEARCH */
        #searchBox {
            position: relative;
            margin-bottom: 20px;
        }

        #search {
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            border: none;
            background: black;
            color: white;
            font-size: 16px;
        }

        #search:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(245,197,24,0.6);
        }

        #searchBox button {
            width: 100%;
            margin-top: 10px;
        }

        /* ✅ DROPDOWN */
        #suggestions {
            position: absolute;
            top: 55px;
            width: 100%;
            background: rgba(0,0,0,0.95);
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            display: none;
            z-index: 1000;
        }

        .suggestion-item {
            padding: 12px;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background: #f5c518;
            color: black;
        }

        /* ✅ PROFILE BUTTON */
        .profile-btn {
            background: rgba(0,0,0,0.85);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 12px;

            display: flex;
            align-items: center;
            gap: 12px;

            cursor: pointer;
            transition: 0.25s;
        }

        .profile-btn:hover {
            background: #f5c518;
            transform: scale(1.03);
            color: black;
        }

        /* ✅ IMAGE AVATAR */
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .name {
            font-weight: bold;
        }

        .role {
            font-size: 13px;
            opacity: 0.8;
        }

        #profile {
            margin-top: 20px;
        }

        /* ✅ BIG PROFILE CARD IMAGE */
        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

    </style>
</head>

<body>

<script>
    if (!localStorage.getItem("role")) {
        alert("Please login first");
        window.location.href = "login.html";
    }
</script>

<div class="container">

    <h1>Movie Cast Viewer</h1>

    <!-- ✅ SEARCH -->
    <div id="searchBox">
        <input type="text" id="search" placeholder="Search movie..."
               onkeyup="showSuggestions()" />

        <button onclick="searchMovie()">Search</button>

        <div id="suggestions"></div>
    </div>

    <hr>

    <div id="result"></div>

    <ul id="actorList"></ul>

    <div id="profile"></div>

    <button onclick="logout()">Logout</button>

</div>

<script>

    let allMovies = [];

    // ✅ LOAD
    document.addEventListener("DOMContentLoaded", () => {
        fetch("/movies/all")
            .then(res => res.json())
            .then(data => {
                allMovies = data;
            });
    });

    // ✅ SUGGESTIONS
    function showSuggestions() {

        const keyword = document.getElementById("search").value.toLowerCase();
        const box = document.getElementById("suggestions");

        box.innerHTML = "";

        if (!keyword) {
            box.style.display = "none";
            return;
        }

        const filtered = allMovies.filter(m =>
            m.title.toLowerCase().includes(keyword)
        );

        filtered.forEach(movie => {

            const div = document.createElement("div");
            div.className = "suggestion-item";
            div.innerText = movie.title;

            div.onclick = () => {
                document.getElementById("search").value = movie.title;
                box.style.display = "none";
                showMovie(movie);
            };

            box.appendChild(div);
        });

        box.style.display = filtered.length ? "block" : "none";
    }

    // ✅ SEARCH
    function searchMovie() {

        const keyword = document.getElementById("search").value.toLowerCase();
        const movie = allMovies.find(m =>
            m.title.toLowerCase() === keyword
        );

        if (!movie) {
            alert("Movie not found");
            return;
        }

        document.getElementById("suggestions").style.display = "none";
        showMovie(movie);
    }

    // ✅ SHOW MOVIE
    function showMovie(movie) {

        const resultDiv = document.getElementById("result");
        const actorList = document.getElementById("actorList");

        resultDiv.innerHTML = `<h2>${movie.title}</h2>`;
        actorList.innerHTML = "";
        document.getElementById("profile").innerHTML = "";

        if (!movie.contributors) return;

        resultDiv.innerHTML += `<p><b>Cast (${movie.contributors.length})</b></p>`;

        movie.contributors.forEach(c => {

            const li = document.createElement("li");
            li.className = "profile-btn";

            li.innerHTML = `
                <img src="${c.photo}" class="avatar.name}</div>
                    <div class="role">${c.role}</div>
                </div>
            `;

            li.onclick = () => showProfile(c);

            actorList.appendChild(li);
        });
    }

    // ✅ PROFILE WITH IMAGE
    function showProfile(c) {

        document.getElementById("profile").innerHTML = `
            <div class="card">
                <img src="${c.photo}" class="profile-img>
                <p><b>Role:</b> ${c.role}</p>
                <p><b>Age:</b> ${c.age}</p>
                <p><b>Country:</b> ${c.country}</p>
            </div>
        `;
    }

    // ✅ CLOSE DROPDOWN
    document.addEventListener("click", (e) => {
        if (!e.target.closest("#searchBox")) {
            document.getElementById("suggestions").style.display = "none";
        }
    });

    // ✅ LOGOUT
    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

</script>

</body>
</html>
