<!DOCTYPE html>
<html>
<head>
    <title>Movie Cast Viewer</title>
    <link rel = "stylesheet" href="/css/style.css">
</head>
<body>

<script>
    const role = localStorage.getItem("role");

    if (!role) {
        alert("Please login first");
        window.location.href = "login.html";
    }
</script>

<div class="container">

    <h1>Movie Cast Viewer</h1>

    <p>Search movie by title</p>

    <!-- ✅ INPUT -->
    <label>Movie Title</label>
    <input type="text" id="movieTitle" placeholder="Enter movie name">

    <button onclick="loadActors()">View Contributors</button>


    <ul id="actorList"></ul>

    <button onclick="logout()">Logout</button>

</div>

<script>

    function loadActors() {

        const title = document.getElementById("movieTitle").value.trim();
        const actorList = document.getElementById("actorList");

        actorList.innerHTML = "";

        if (!title) {
            actorList.innerHTML = "<li>Please enter movie title</li>";
            return;
        }

        // ✅ Step 1: Find movie by title
        fetch(`/movies/search?title=${title}`)
            .then(res => res.json())
            .then(movie => {

                if (!movie) {
                    actorList.innerHTML = "<li>Movie not found</li>";
                    return;
                }

                // ✅ Step 2: Use movieId to get actors
                fetch(`/movies/${movie.movieId}/contributors`)
                    .then(res => res.json())
                    .then(data => {

                        if (data.length === 0) {
                            actorList.innerHTML = "<li>No actors found</li>";
                            return;
                        }

                        data.forEach(actor => {
                            const li = document.createElement("li");
                            li.innerHTML = `
                                <b>${actor.name}</b><br>
                                ID: ${actor.id}
                            `;
                            actorList.appendChild(li);
                        });
                    });

            })
            .catch(err => {
                console.error(err);
                actorList.innerHTML = "<li>Error loading data</li>";
            });
    }

    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

</script>

</body>
</html>
