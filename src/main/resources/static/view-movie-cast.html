<!DOCTYPE html>
<html>
<head>
    <title>Movie Cast Viewer</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<script>
    const role = localStorage.getItem("role");

    if (!role) {
        alert("Please login first");
        window.location.href = "login.html";
    }
</script>

<div class="container">

    <h1>Movie Cast Viewer</h1>

    <!-- ✅ MOVIE LIST -->
    <div id="moviesList"></div>

    <hr>

    <!-- ✅ RESULTS -->
    <div id="result"></div>
    <ul id="actorList"></ul>

    <button onclick="logout()">Logout</button>

</div>

<script>

    // ✅ LOAD ALL MOVIES AUTOMATICALLY
    document.addEventListener("DOMContentLoaded", loadAllMovies);

    function loadAllMovies() {

        const listDiv = document.getElementById("moviesList");
        listDiv.innerHTML = "<h3>Select a Movie</h3>";

        fetch("/movies/all")
            .then(res => res.json())
            .then(data => {

                if (data.length === 0) {
                    listDiv.innerHTML += "<p>No movies available</p>";
                    return;
                }

                data.forEach(m => {

                    const div = document.createElement("div");
                    div.className = "movie-card";
                    div.innerText = m.title;

                    div.onclick = function () {
                        viewMovie(m.title);
                    };

                    listDiv.appendChild(div);
                });
            });
    }


    // ✅ CLICK MOVIE
    function viewMovie(title) {

        const resultDiv = document.getElementById("result");
        const actorList = document.getElementById("actorList");

        resultDiv.innerHTML = "";
        actorList.innerHTML = "";

        fetch(`/movies/search?title=${encodeURIComponent(title)}`)
            .then(res => res.json())
            .then(movie => {

                if (!movie) {
                    resultDiv.innerHTML = "Movie not found";
                    return;
                }

                // ✅ SHOW TITLE
                resultDiv.innerHTML = `<h2>${movie.title}</h2>`;

                fetch(`/movies/${movie.movieId}/contributors`)
                    .then(res => res.json())
                    .then(data => {

                        if (data.length === 0) {
                            actorList.innerHTML = "<li>No contributors found</li>";
                            return;
                        }

                        resultDiv.innerHTML += `<p><b>Cast (${data.length})</b></p>`;

                        data.forEach(actor => {
                            const li = document.createElement("li");
                            li.innerHTML = `
                                <b>${actor.name}</b><br>
                                ${actor.role}
                            `;
                            actorList.appendChild(li);
                        });

                    });
            });
    }


    // ✅ LOGOUT
    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

</script>

</body>
</html>
``
