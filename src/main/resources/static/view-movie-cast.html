<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IMDb Style Movie Cast Viewer</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>

        /* ================================================= */
        /* BODY */
        /* ================================================= */

        body {

            font-family: Arial, sans-serif;

            background:
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
                url("/images/bg.jpg");

            background-size: cover;
            background-position: center;

            color: white;

            margin: 0;
            padding: 0;

            min-height: 100vh;
        }

        /* ================================================= */
        /* CONTAINER */
        /* ================================================= */

        .container {

            width: 90%;
            max-width: 1000px;

            margin: auto;

            padding: 30px;
        }

        /* ================================================= */
        /* TITLE */
        /* ================================================= */

        h1 {

            text-align: center;

            color: #f5c518;

            font-size: 48px;

            margin-bottom: 30px;
        }

        /* ================================================= */
        /* SEARCH */
        /* ================================================= */

        #searchBox {

            position: relative;

            margin-bottom: 25px;
        }

        #search {

            width: 100%;

            padding: 16px;

            border-radius: 40px;

            border: none;

            background: rgba(0,0,0,0.8);

            color: white;

            font-size: 16px;
        }

        #search:focus {

            outline: none;

            box-shadow: 0 0 12px rgba(245,197,24,0.7);
        }

        /* ================================================= */
        /* BUTTON GROUP */
        /* ================================================= */

        .button-group {

            display: flex;

            gap: 15px;

            margin-top: 18px;
        }

        /* ================================================= */
        /* SEARCH BUTTON */
        /* ================================================= */

        .search-btn {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 30px;

            background: linear-gradient(135deg, #f5c518, #ffd700);

            color: black;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .search-btn:hover {

            transform: scale(1.03);

            background: white;
        }

        /* ================================================= */
        /* LOGOUT BUTTON */
        /* ================================================= */

        .logout-btn {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 30px;

            background: crimson;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .logout-btn:hover {

            transform: scale(1.03);

            background: red;
        }

        /* ================================================= */
        /* SUGGESTIONS */
        /* ================================================= */

        #suggestions {

            position: absolute;

            top: 65px;

            width: 100%;

            background: rgba(0,0,0,0.95);

            border-radius: 15px;

            overflow: hidden;

            display: none;

            z-index: 1000;
        }

        .suggestion-item {

            padding: 14px;

            cursor: pointer;

            transition: 0.2s;
        }

        .suggestion-item:hover {

            background: #f5c518;

            color: black;
        }

        /* ================================================= */
        /* MOVIE RESULT */
        /* ================================================= */

        #result {

            margin-top: 30px;

            margin-bottom: 20px;
        }

        #result h2 {

            color: #f5c518;

            font-size: 32px;
        }

        /* ================================================= */
        /* ACTOR LIST */
        /* ================================================= */

        #actorList {

            list-style: none;

            padding: 0;
        }

        .profile-btn {

            display: flex;

            align-items: center;

            gap: 15px;

            padding: 15px;

            margin-bottom: 15px;

            background: rgba(255,255,255,0.08);

            border-radius: 18px;

            cursor: pointer;

            transition: 0.3s;
        }

        .profile-btn:hover {

            transform: translateY(-2px);

            background: rgba(245,197,24,0.15);
        }

        /* ================================================= */
        /* AVATAR */
        /* ================================================= */

        .avatar {

            width: 65px;
            height: 65px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #f5c518;
        }

        .name {

            font-size: 18px;

            font-weight: bold;
        }

        .role {

            color: #ccc;

            margin-top: 4px;
        }

        /* ================================================= */
        /* PROFILE CARD */
        /* ================================================= */

        .profile-card {

            margin-top: 35px;

            background: rgba(255,255,255,0.08);

            padding: 30px;

            border-radius: 20px;

            text-align: center;

            animation: fadeIn 0.4s ease;
        }

        .profile-img {

            width: 140px;
            height: 140px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #f5c518;

            margin-bottom: 20px;
        }

        .profile-card h2 {

            color: #f5c518;

            margin-bottom: 15px;
        }

        .profile-card p {

            color: #ddd;

            margin-bottom: 12px;

            line-height: 1.6;
        }

        /* ================================================= */
        /* HR */
        /* ================================================= */

        hr {

            border: 1px solid rgba(255,255,255,0.15);

            margin-top: 30px;
        }

        /* ================================================= */
        /* ANIMATION */
        /* ================================================= */

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(10px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }

        /* ================================================= */
        /* RESPONSIVE */
        /* ================================================= */

        @media (max-width: 768px) {

            .button-group {

                flex-direction: column;
            }

            h1 {

                font-size: 36px;
            }

            .container {

                width: 95%;
            }
        }

    </style>

</head>

<body>

<script>

    // LOGIN CHECK
    if (!localStorage.getItem("role")) {

        alert("Please login first");

        window.location.href = "login.html";
    }

</script>

<div class="container">

    <h1>Movie Cast Viewer</h1>

    <!-- SEARCH -->
    <div id="searchBox">

        <input
                type="text"
                id="search"
                placeholder="Search movie..."
                onkeyup="showSuggestions()"
        >

        <div id="suggestions"></div>

        <!-- BUTTONS -->
        <div class="button-group">

            <button
                    class="search-btn"
                    onclick="searchMovie()"
            >
                Search
            </button>

            <button
                    class="logout-btn"
                    onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>

    <hr>

    <!-- RESULT -->
    <div id="result"></div>

    <!-- ACTORS -->
    <ul id="actorList"></ul>

    <!-- PROFILE -->
    <div id="profile"></div>

</div>

<script>

    let allMovies = [];

    // LOAD MOVIES
    document.addEventListener("DOMContentLoaded", () => {

        fetch("/movies/all")

            .then(res => res.json())

            .then(data => {

                allMovies = data;
            })

            .catch(err => {

                console.error("Error loading movies:", err);
            });

    });

    // LOGOUT
    function logout() {

        localStorage.removeItem("role");

        alert("Logged out successfully");

        window.location.href = "login.html";
    }

    // SEARCH SUGGESTIONS
    function showSuggestions() {

        const keyword = document
            .getElementById("search")
            .value
            .toLowerCase();

        const box = document.getElementById("suggestions");

        box.innerHTML = "";

        if (!keyword) {

            box.style.display = "none";

            return;
        }

        const filtered = allMovies.filter(movie =>

            movie.title
                 .toLowerCase()
                 .includes(keyword)
        );

        filtered.forEach(movie => {

            const div = document.createElement("div");

            div.className = "suggestion-item";

            div.innerText = movie.title;

            div.onclick = () => {

                document.getElementById("search").value =
                    movie.title;

                box.style.display = "none";

                showMovie(movie);
            };

            box.appendChild(div);
        });

        box.style.display =
            filtered.length ? "block" : "none";
    }

    // SEARCH MOVIE
    function searchMovie() {

        const keyword = document
            .getElementById("search")
            .value
            .toLowerCase();

        const movie = allMovies.find(m =>

            m.title.toLowerCase() === keyword
        );

        if (!movie) {

            alert("Movie not found");

            return;
        }

        showMovie(movie);
    }

    // SHOW MOVIE
    function showMovie(movie) {

        const resultDiv =
            document.getElementById("result");

        const actorList =
            document.getElementById("actorList");

        resultDiv.innerHTML = `

            <h2>${movie.title}</h2>

            <p>
                <b>
                    Cast Members:
                    ${movie.contributors?.length || 0}
                </b>
            </p>
        `;

        actorList.innerHTML = "";

        document.getElementById("profile").innerHTML = "";

        if (!movie.contributors) return;

        movie.contributors.forEach(c => {

            const li = document.createElement("li");

            li.className = "profile-btn";

            li.innerHTML = `

                <img
                    src="${c.photo}"
                    class="avatar"
                    onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png'"
                >

                <div>

                    <div class="name">
                        ${c.name}
                    </div>

                    <div class="role">
                        ${c.role}
                    </div>

                </div>
            `;

            li.onclick = () => showProfile(c);

            actorList.appendChild(li);
        });
    }

    // SHOW PROFILE
    function showProfile(c) {

        document.getElementById("profile").innerHTML = `

            <div class="profile-card">

                <img
                    src="${c.photo}"
                    class="profile-img"
                    onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png'"
                >

                <h2>${c.name}</h2>

                <p>
                    <b>Role:</b>
                    ${c.role}
                </p>

                <p>
                    <b>Country:</b>
                    ${c.country}
                </p>

                <p>
                    <b>Age:</b>
                    ${c.age}
                </p>

                <p>
                    <b>Description:</b>
                    ${c.description || "No description available"}
                </p>

                <p>
                    <b>Awards:</b>
                    ${c.awards || "No awards listed"}
                </p>

                <p>
                    <b>Notable Works:</b>
                    ${c.notableWorks || "No works listed"}
                </p>

            </div>
        `;
    }

</script>

</body>
</html>
