<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Movie</title>

    <style>

        body {

            margin: 0;
            padding: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Poppins", Arial, sans-serif;

            background:
                linear-gradient(rgba(0,0,0,0.75),
                rgba(0,0,0,0.92)),
                url("/images/bg.jpg");

            background-size: cover;
            background-position: center;

            color: white;
        }

        .container {

            width: 100%;
            max-width: 750px;

            background: rgba(20,20,20,0.92);

            padding: 40px;

            border-radius: 24px;
        }

        input,
        select {

            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 16px;

            margin-top: 10px;

            background: rgba(255,255,255,0.08);

            color: white;
        }

        select[multiple] {
            height: 160px;
        }

        .preview {

            width: 100%;
            height: 220px;

            object-fit: cover;

            border-radius: 18px;

            margin-top: 15px;
        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: none;
            border-radius: 18px;

            font-weight: bold;

            cursor: pointer;
        }

        .update-btn {

            background:
                linear-gradient(135deg,#f5c518,#ffd84d);

            color: black;
        }

        .back-btn {

            background: rgba(255,255,255,0.08);

            color: white;
        }

        .back-btn:hover {

            background: rgba(255,255,255,0.15);
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🎬 Edit Movie</h1>

    <label>Title</label>
    <input type="text" id="title">

    <label>Year</label>
    <input type="number" id="year">

    <label>Movie Banner</label>

    <input type="file"
           id="bannerFile"
           accept="image/*">

    <img id="preview"
         class="preview">

    <label>Actors</label>
    <select id="actors" multiple></select>

    <label>Director</label>
    <select id="director"></select>

    <button class="update-btn"
            onclick="updateMovie()">

        Update Movie

    </button>

    <button class="back-btn"
            onclick="goBack()">

        ⬅ Back

    </button>

    <div id="result"></div>

</div>

<script>

    const params =
        new URLSearchParams(window.location.search);

    const movieId =
        params.get("id");

    let allContributors = [];

    let currentBanner = "";

    document
    .getElementById("bannerFile")
    .addEventListener("change", function(e) {

        const file = e.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(event) {

            currentBanner = event.target.result;

            document
            .getElementById("preview")
            .src = currentBanner;
        };

        reader.readAsDataURL(file);
    });

    document
    .addEventListener(
        "DOMContentLoaded",
        async () => {

            await loadContributors();

            await loadMovie();
        }
    );

    async function loadContributors() {

        const res =
            await fetch("/contributors/all");

        allContributors =
            await res.json();

        const actorSelect =
            document.getElementById("actors");

        const directorSelect =
            document.getElementById("director");

        allContributors.forEach(c => {

            if (c.role === "Actor") {

                actorSelect.innerHTML += `
                    <option value="${c.id}">
                        ${c.name}
                    </option>
                `;
            }

            if (c.role === "Director") {

                directorSelect.innerHTML += `
                    <option value="${c.id}">
                        ${c.name}
                    </option>
                `;
            }
        });
    }

    async function loadMovie() {

        const res =
            await fetch("/movies/all");

        const movies =
            await res.json();

        const movie =
            movies.find(
                m => m.movieId == movieId
            );

        document
        .getElementById("title")
        .value = movie.title;

        document
        .getElementById("year")
        .value = movie.year;

        currentBanner =
            movie.banner;

        document
        .getElementById("preview")
        .src = currentBanner;

        movie.contributors.forEach(c => {

            const found =
                allContributors.find(
                    x => x.id == c.id
                );

            if (!found) return;

            if (found.role === "Director") {

                document
                .getElementById("director")
                .value = found.id;
            }

            if (found.role === "Actor") {

                const option =
                    document.querySelector(
                        `#actors option[value="${found.id}"]`
                    );

                if (option)
                    option.selected = true;
            }
        });
    }

    async function updateMovie() {

        const title =
            document
            .getElementById("title")
            .value;

        const year =
            document
            .getElementById("year")
            .value;

        const actorSelect =
            document
            .getElementById("actors");

        const directorId =
            document
            .getElementById("director")
            .value;

        const contributors =
            Array.from(
                actorSelect.selectedOptions
            )

            .map(o => ({
                id: o.value
            }));

        if (directorId) {

            contributors.push({
                id: directorId
            });
        }

        const updatedMovie = {

            movieId,

            title,

            year,

            banner: currentBanner,

            contributors
        };

        const res =
            await fetch(
                "/movies/update/" + movieId,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body:
                        JSON.stringify(
                            updatedMovie
                        )
                }
            );

        document
        .getElementById("result")
        .innerText =
            await res.text();
    }

    function goBack() {

        window.location.href =
            "edit-movie.html";
    }

</script>

</body>
</html>
