<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Contributor</title>

    <!-- ✅ FIXED CSS LINK -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ✅ Admin-only guard -->
<script>
    if (localStorage.getItem("role") !== "ADMIN") {
        alert("Admins only");
        window.location.href = "login.html";
    }
</script>

<div class="container">

    <h1>Add Contributor</h1>

    <!-- ✅ Navigation -->
    <div class="nav">
        <a href="add-contributor.html">Add Contributor</a> |
        <a href="add-movie.html">Add Movie</a> |
        <a href="view-movie-cast.html">Movie Cast Viewer</a>
    </div>

    <!-- ❌ REMOVED ID FIELD (AUTO GENERATED) -->

    <!-- ✅ Name -->
    <label>Name</label>
    <input type="text" id="name" placeholder="Leonardo DiCaprio">

    <!-- ✅ Role (dropdown is safer ✅) -->
    <label>Role</label>
    <select id="role">
        <option value="">Select Role</option>
        <option value="Actor">Actor</option>
        <option value="Director">Director</option>
    </select>

    <!-- ✅ Age -->
    <label>Age</label>
    <input type="number" id="age" placeholder="48">

    <!-- ✅ Country -->
    <label>Country</label>
    <input type="text" id="country" placeholder="USA">

    <button onclick="addContributor()">Add Contributor</button>
    <button onclick="logout()">Logout</button>

    <div id="result"></div>

</div>

<script>
    function addContributor() {

        const contributor = {
            // ❌ NO ID FIELD → backend generates it
            name: document.getElementById("name").value.trim(),
            role: document.getElementById("role").value.trim(),
            age: document.getElementById("age").value,
            country: document.getElementById("country").value.trim()
        };

        // ✅ Validation
        if (!contributor.name || !contributor.role ||
            !contributor.age || !contributor.country) {
            document.getElementById("result").innerText = "Please fill all fields";
            return;
        }

        fetch("/contributors/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(contributor)
        })
        .then(res => res.text())
        .then(data => {
            document.getElementById("result").innerText = data;

            // ✅ Clear inputs after success (nice UX)
            document.getElementById("name").value = "";
            document.getElementById("role").value = "";
            document.getElementById("age").value = "";
            document.getElementById("country").value = "";
        })
        .catch(err => {
            console.error(err);
            document.getElementById("result").innerText = "Error adding contributor";
        });
    }

    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }
</script>

</body>
</html>
