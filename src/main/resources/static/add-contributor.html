<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Contributor</title>

    <!-- ✅ Correct CSS link -->
    <link rel="stylesheet" href="css/style.css"
</head>
<body>

</div>

<!-- ✅ Admin-only guard -->
<script>
    if (localStorage.getItem("role") !== "ADMIN") {
        alert("Admins only");
        window.location.href = "login.html";
    }
</script>

<div class="container">

    <h1>Add Contributor</h1>


    <!-- ✅ ✅ FIXED NAVIGATION (REAL LINKS) -->

    <div class="nav">
        <a href="add-contributor.html">Add Contributor</a> |
        <a href="add-movie.html">Add Movie</a> |
        <a href="view-movie-cast.html">Movie Cast Viewer</a>
    </div>


    <!-- ✅ Contributor ID -->
    <label for="id">Contributor ID</label>
    <input type="text" id="id" placeholder="A001 or D001">

    <!-- ✅ Name -->
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Leonardo DiCaprio">

    <!-- ✅ Role -->
    <label for="role">Role</label>
    <input type="text" id="role" placeholder="Actor or Director">

    <!-- ✅ Age -->
    <label for="age">Age</label>
    <input type="number" id="age" placeholder="48">

    <!-- ✅ Country -->
    <label for="country">Country</label>
    <input type="text" id="country" placeholder="USA">

    <button onclick="addContributor()">Add Contributor</button>
    <button onclick="logout()">Logout</button>

    <div id="result"></div>

</div>

<script>
    function addContributor() {

        const contributor = {
            id: document.getElementById("id").value.trim(),
            name: document.getElementById("name").value.trim(),
            role: document.getElementById("role").value.trim(),
            age: document.getElementById("age").value,
            country: document.getElementById("country").value.trim()
        };

        if (!contributor.id || !contributor.name || !contributor.role ||
            !contributor.age || !contributor.country) {
            document.getElementById("result").innerText = "Please fill all fields";
            return;
        }

        fetch("/contributors/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(contributor)
        })
        .then(res => res.text())
        .then(data => {
            document.getElementById("result").innerText = data;
        })
        .catch(err => {
            console.error(err);
            document.getElementById("result").innerText = "Error adding contributor";
        });
    }

    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }
</script>

</body>
</html>
