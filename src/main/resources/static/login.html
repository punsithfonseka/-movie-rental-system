<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    /* ================================================= */
    /* BODY */
    /* ================================================= */

    body {

        margin: 0;

        padding: 0;

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        font-family: "Poppins", Arial, sans-serif;

        background:
            linear-gradient(
                rgba(0,0,0,0.75),
                rgba(0,0,0,0.85)
            ),

            url("images/bg.jpg");

        background-size: cover;

        background-position: center;

        overflow: hidden;
    }

    /* ================================================= */
    /* LOGIN BOX */
    /* ================================================= */

    .login-box {

        width: 100%;

        max-width: 420px;

        background: rgba(15,15,15,0.92);

        backdrop-filter: blur(12px);

        border-radius: 25px;

        padding: 45px;

        box-shadow:
            0 10px 40px rgba(0,0,0,0.7);

        text-align: center;

        animation: fadeIn 0.8s ease;
    }

    /* ================================================= */
    /* ANIMATION */
    /* ================================================= */

    @keyframes fadeIn {

        from {

            opacity: 0;

            transform: translateY(30px);
        }

        to {

            opacity: 1;

            transform: translateY(0);
        }
    }

    /* ================================================= */
    /* TITLE */
    /* ================================================= */

    h1 {

        color: #f5c518;

        margin-bottom: 10px;

        font-size: 38px;
    }

    p {

        color: #cccccc;

        margin-bottom: 35px;

        font-size: 15px;
    }

    /* ================================================= */
    /* FORM GROUP */
    /* ================================================= */

    .form-group {

        margin-bottom: 22px;
    }

    /* ================================================= */
    /* INPUTS */
    /* ================================================= */

    input {

        width: 100%;

        padding: 15px 18px;

        border: none;

        border-radius: 18px;

        background: rgba(255,255,255,0.08);

        color: white;

        font-size: 15px;

        box-sizing: border-box;

        transition: 0.3s;
    }

    input::placeholder {

        color: #aaaaaa;
    }

    input:focus {

        outline: none;

        background: rgba(255,255,255,0.12);

        box-shadow:
            0 0 12px rgba(245,197,24,0.6);
    }

    /* ================================================= */
    /* BUTTON */
    /* ================================================= */

    button {

        width: 100%;

        padding: 15px;

        border: none;

        border-radius: 18px;

        background:
            linear-gradient(
                135deg,
                #f5c518,
                #ffd84d
            );

        color: black;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }

    button:hover {

        transform: translateY(-2px);

        background: white;
    }

    /* ================================================= */
    /* RESULT */
    /* ================================================= */

    #result {

        margin-top: 18px;

        font-weight: bold;

        color: white;

        min-height: 20px;
    }

    /* ================================================= */
    /* RESPONSIVE */
    /* ================================================= */

    @media (max-width: 500px) {

        .login-box {

            margin: 20px;

            padding: 30px;
        }

        h1 {

            font-size: 30px;
        }
    }

  </style>

</head>

<body>

<div class="login-box">

  <h1>🎬 Welcome Back</h1>

  <p>Login to continue</p>

  <!-- USERNAME -->
  <div class="form-group">

    <input
            type="text"
            id="username"
            placeholder="Enter Username"
    >

  </div>

  <!-- PASSWORD -->
  <div class="form-group">

    <input
            type="password"
            id="password"
            placeholder="Enter Password"
    >

  </div>

  <!-- BUTTON -->
  <button onclick="login()">
    Login
  </button>

  <!-- RESULT -->
  <div id="result"></div>

</div>

<script>

  function login() {

      const username =
          document.getElementById("username")
          .value
          .trim();

      const password =
          document.getElementById("password")
          .value
          .trim();

      const result =
          document.getElementById("result");

      result.innerText = "";

      // VALIDATION
      if (!username || !password) {

          result.innerText =
              "Please fill all fields";

          return;
      }

      fetch(
          `/login?username=${
              encodeURIComponent(username)
          }&password=${
              encodeURIComponent(password)
          }`
      )

      .then(res => res.text())

      .then(data => {

          // ADMIN LOGIN
          if (
              data.toLowerCase()
              .includes("admin")
          ) {

              localStorage.setItem(
                  "role",
                  "ADMIN"
              );

              result.innerText =
                  "Login successful ✅";

              setTimeout(() => {

                  window.location.href =
                      "add-contributor.html";

              }, 700);
          }

          // USER LOGIN
          else if (
              data.toLowerCase()
              .includes("user")
          ) {

              localStorage.setItem(
                  "role",
                  "USER"
              );

              result.innerText =
                  "Login successful ✅";

              setTimeout(() => {

                  window.location.href =
                      "view-movie-cast.html";

              }, 700);
          }

          // INVALID LOGIN
          else {

              result.innerText =
                  "Invalid login ❌";
          }
      })

      .catch(() => {

          result.innerText =
              "Error. Try again.";
      });
  }

</script>

</body>

</html>
