<!DOCTYPE html><!DOCTYPE html="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-box">

  <h1>🎬 Welcome Back</h1>
  <p>Login to continue</p>

  <div class="form-group">
    <input type="text" id="username" placeholder="Username">
  </div>

  <div class="form-group">
    <input type="password" id="password" placeholder="Password">
  </div>

  <button onclick="login()">Login</button>

  <div id="result"></div>

</div>

<script>

  function login() {

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const result = document.getElementById("result");

      result.innerText = "";

      if (!username || !password) {
          result.innerText = "Please fill all fields";
          return;
      }

      fetch(`/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`)
          .then(res => res.text())
          .then(data => {

              if (data.toLowerCase().includes("admin")) {
                  localStorage.setItem("role", "ADMIN");
                  result.innerText = "Login successful ✅";

                  setTimeout(() => {
                      window.location.href = "add-contributor.html";
                  }, 700);
              }

              else if (data.toLowerCase().includes("user")) {
                  localStorage.setItem("role", "USER");
                  result.innerText = "Login successful ✅";

                  setTimeout(() => {
                      window.location.href = "view-movie-cast.html";
                  }, 700);
              }

              else {
                  result.innerText = "Invalid login ❌";
              }
          })
          .catch(() => {
              result.innerText = "Error. Try again.";
          });
  }

</script>

</body>
</html>
