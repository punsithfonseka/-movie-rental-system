<!DOCTYPE html><!DOCTYPEtitle>Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>


<div class="container">

  <h1>Login</h1>
  <p>Please login to continue</p>

  <label>Username</label>
  <input type="text" id="username" placeholder="admin1 or user1">

  <label>Password</label>
  <input type="password" id="password" placeholder="1234">

  <button onclick="login()">Login</button>

  <div id="result"></div>
</div>

<script>
  function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const result = document.getElementById("result");

      fetch(`/login?username=${username}&password=${password}`)
          .then(res => res.text())
          .then(data => {
              result.innerText = data;

              if (data.includes("Admin")) {
                  localStorage.setItem("role", "ADMIN");
                  window.location.href = "add-contributor.html";
              }
              else if (data.includes("User")) {
                  localStorage.setItem("role", "USER");
                  window.location.href = "view-movie-cast.html";
              }
          });
  }
</script>

</body>
</html>
<html lang="en">
<head>
  <meta charset="UTF-8">
