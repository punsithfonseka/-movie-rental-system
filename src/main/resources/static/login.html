<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h1>Login</h1>
  <p>Please login to continue</p>

  <label>Username</label>
  <input type="text" id="username" placeholder="admin1 or user1">

  <label>Password</label>
  <input type="password" id="password" placeholder="1234">

  <button onclick="login()">Login</button>

  <div id="result"></div>

</div>

<script>

  function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const result = document.getElementById("result");

      if (!username || !password) {
          result.innerText = "Please enter username and password";
          return;
      }

      fetch(`/login?username=${username}&password=${password}`)
          .then(res => res.text())
          .then(data => {

              result.innerText = data;

              // ✅ ADMIN LOGIN
              if (data.toLowerCase().includes("admin")) {
                  localStorage.setItem("role", "ADMIN");

                  // ✅ redirect to dashboard (better flow)
                  window.location.href = "add-contributor.html";
              }

              // ✅ USER LOGIN
              else if (data.toLowerCase().includes("user")) {
                  localStorage.setItem("role", "USER");

                  window.location.href = "view-movie-cast.html";
              }
          })
          .catch(() => {
              result.innerText = "Login failed. Try again.";
          });
  }

</script>

</body>
</html>
