<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Contributor</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<script>
    if (localStorage.getItem("role") !== "ADMIN") {
        alert("Admins only!");
        window.location.href = "login.html";
    }
</script>

<div class="container">

    <h1>Edit Contributor</h1>

    <!-- ✅ FORM -->

    <div class="form-group">
        <label>Name</label>
        <input id="name" placeholder="Enter name">
    </div>

    <div class="form-group">
        <label>Role</label>
        <select id="role">
            <option value="">Select Role</option>
            <option value="Actor">Actor</option>
            <option value="Director">Director</option>
        </select>
    </div>

    <div class="form-group">
        <label>Age</label>
        <input id="age" type="number">
    </div>

    <div class="form-group">
        <label>Country</label>
        <input id="country">
    </div>

    <!-- ✅ ✅ NEW PHOTO FIELD -->
    <div class="form-group">
        <label>Photo URL</label>
        <input id="photo" placeholder="https://image-link">
    </div>

    <!-- ✅ ACTIONS -->
    <button onclick="updateContributor()">Update Contributor</button>
    <button onclick="logout()">Logout</button>

    <div id="result"></div>

    <!-- ✅ NAV -->
    <div class="nav-buttons">
        <button onclick="goBack()">⬅</button>
    </div>

</div>

<script>

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    // ✅ LOAD DATA
    function loadContributor() {

        fetch("/contributors/all")
            .then(res => res.json())
            .then(data => {

                const c = data.find(x => x.id === id);

                if (!c) {
                    document.getElementById("result").innerText = "Contributor not found";
                    return;
                }

                document.getElementById("name").value = c.name;
                document.getElementById("role").value = c.role;
                document.getElementById("age").value = c.age;
                document.getElementById("country").value = c.country;

                // ✅ LOAD PHOTO
                document.getElementById("photo").value = c.photo || "";
            });
    }

    // ✅ UPDATE
    function updateContributor() {

        const updated = {
            name: document.getElementById("name").value.trim(),
            role: document.getElementById("role").value.trim(),
            age: document.getElementById("age").value,
            country: document.getElementById("country").value.trim(),
            photo: document.getElementById("photo").value.trim()   // ✅ NEW
        };

        // ✅ Validation
        if (!updated.name || !updated.role || !updated.age || !updated.country) {
            document.getElementById("result").innerText = "Please fill all fields";
            return;
        }

        fetch(`/contributors/update/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updated)
        })
        .then(res => res.text())
        .then(msg => {
            alert(msg);

            // ✅ Redirect after update
            window.location.href = "contributors.html";
        });
    }

    // ✅ NAVIGATION
    function goBack() {
        window.location.href = "contributors.html";
    }

    // ✅ LOAD PAGE
    loadContributor();

    // ✅ LOGOUT
    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

</script>

</body>
</html>
