<!DOCTYPE html>
<html>
<head>
  <title>Add Movie</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<script>
  // ✅ ADMIN GUARD
  if (localStorage.getItem("role") !== "ADMIN") {
      alert("Admins only");
      window.location.href = "login.html";
  }
</script>

<div class="container">

  <h1>Add Movie</h1>
  <p>Admin only</p>

  <!-- ✅ SIMPLE NAV -->
  <div class="nav-buttons">
    <button onclick="goBack()">Back</button>
    <button onclick="goNext()">Next</button>
  </div>

  <!-- ✅ TITLE -->
  <label>Title</label>
  <input type="text" id="title" placeholder="Inception">

  <!-- ✅ ACTORS -->
  <label>Actors (Hold Ctrl to select multiple)</label>
  <select id="actors" multiple></select>

  <!-- ✅ DIRECTOR -->
  <label>Director</label>
  <select id="director"></select>

  <button onclick="addMovie()">Add Movie</button>
  <button onclick="logout()">Logout</button>

  <div id="result"></div>

</div>

<script>

  // ✅ NAVIGATION
  function goBack() {
      window.location.href = "add-contributor.html";
  }

  function goNext() {
      window.location.href = "contributors.html";
  }


  // ✅ LOAD CONTRIBUTORS
  document.addEventListener("DOMContentLoaded", loadContributors);

  function loadContributors() {

      fetch("/contributors/all")
          .then(res => res.json())
          .then(data => {

              const actorSelect = document.getElementById("actors");
              const directorSelect = document.getElementById("director");

              actorSelect.innerHTML = "";
              directorSelect.innerHTML = "";

              // ✅ Populate dropdowns
              data.forEach(c => {

                  if (c.role === "Actor") {
                      actorSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                  }

                  if (c.role === "Director") {
                      directorSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                  }
              });
          })
          .catch(() => {
              console.error("Error loading contributors");
          });
  }


  // ✅ ADD MOVIE (FIXED ✅)
  function addMovie() {

      const title = document.getElementById("title").value.trim();
      const actorSelect = document.getElementById("actors");
      const directorId = document.getElementById("director").value;

      const selectedActors = Array.from(actorSelect.selectedOptions)
          .map(opt => opt.value)
          .join("|");

      // ✅ FIXED validation
      if (!title || selectedActors.length === 0 || !directorId) {
          document.getElementById("result").innerText = "Please fill all fields";
          return;
      }

      // ✅ DEBUG (optional)
      console.log(title, selectedActors, directorId);

      // ✅ FIXED REQUEST (IMPORTANT ✅)
      fetch(`/movies/add?title=${encodeURIComponent(title)}&actorIds=${encodeURIComponent(selectedActors)}&directorIds=${encodeURIComponent(directorId)}`)
          .then(res => res.text())
          .then(data => {
              document.getElementById("result").innerText = data;

              // ✅ RESET
              document.getElementById("title").value = "";
              actorSelect.selectedIndex = -1;
              document.getElementById("director").selectedIndex = 0;
          })
          .catch(() => {
              document.getElementById("result").innerText = "Error adding movie";
          });
  }


  // ✅ LOGOUT
  function logout() {
      localStorage.clear();
      window.location.href = "login.html";
  }

</script>

</body>
</html>
``
