<!DOCTYPE html>
<html>
<head>
  <title>Add Movie</title>
  <link rel="stylesheet" href="/css/style.css">

  <style>
    #preview {
        margin-top: 10px;
        text-align: center;
    }

    #preview img {
        width: 120px;
        border-radius: 10px;
        margin-top: 10px;
    }
  </style>
</head>

<body>

<script>
  if (localStorage.getItem("role") !== "ADMIN") {
      alert("Admins only");
      window.location.href = "login.html";
  }
</script>

<div class="container">

  <h1>Add Movie</h1>
  <p>Admin only</p>

  <div class="nav-buttons">
    <button onclick="goBack()">Back</button>
    <button onclick="goNext()">Next</button>
  </div>

  <label>Title</label>
  <input type="text" id="title" placeholder="Inception">

  <label>Poster URL</label>
  <input type="text" id="poster"
         placeholder="https://image-link"
         oninput="previewImage()">

  <div id="preview"></div>

  <label>Actors (Hold Ctrl to select multiple)</label>
  <select id="actors" multiple></select>

  <label>Director</label>
  <select id="director"></select>

  <button onclick="addMovie()">Add Movie</button>
  <button onclick="logout()">Logout</button>

  <div id="result"></div>

</div>

<script>

  function goBack() {
      window.location.href = "/add-contributor.html";
  }

  function goNext() {
      window.location.href = "/contributors.html";
  }

  document.addEventListener("DOMContentLoaded", loadContributors);

  function loadContributors() {

      fetch("/contributors/all")
          .then(res => res.json())
          .then(data => {

              const actorSelect = document.getElementById("actors");
              const directorSelect = document.getElementById("director");

              actorSelect.innerHTML = "";
              directorSelect.innerHTML = "";

              data.forEach(c => {

                  if (c.role === "Actor") {
                      actorSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                  }

                  if (c.role === "Director") {
                      directorSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                  }
              });
          });
  }

  // ✅ FIXED PREVIEW FUNCTION
  function previewImage() {

      const url = document.getElementById("poster").value;
      const preview = document.getElementById("preview");

      if (!url) {
          preview.innerHTML = "";
          return;
      }

      preview.innerHTML = `${url}`;
  }

  // ✅ ADD MOVIE
  function addMovie() {

      const title = document.getElementById("title").value.trim();
      const poster = document.getElementById("poster").value.trim();

      const actorSelect = document.getElementById("actors");
      const directorId = document.getElementById("director").value;

      const contributors = Array.from(actorSelect.selectedOptions)
          .map(opt => ({ id: opt.value }));

      if (directorId) {
          contributors.push({ id: directorId });
      }

      if (!title || contributors.length === 0) {
          document.getElementById("result").innerText = "Please fill all fields";
          return;
      }

      const movie = {
          movieId: "M" + Math.floor(Math.random() * 1000),
          title: title,
          year: 2024,
          poster: poster,
          contributors: contributors
      };

      fetch("/movies/add", {
          method: "POST",
          headers: {
              "Content-Type": "application/json"
          },
          body: JSON.stringify(movie)
      })
      .then(res => res.text())
      .then(data => {

          document.getElementById("result").innerText = data;

          document.getElementById("title").value = "";
          document.getElementById("poster").value = "";
          document.getElementById("preview").innerHTML = "";

          actorSelect.selectedIndex = -1;
          document.getElementById("director").selectedIndex = 0;
      });
  }

  function logout() {
      localStorage.clear();
      window.location.href = "login.html";
  }

</script>

</body>
</html>
